<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Sensi Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Sensi Config Generator</h1>
            <p>Find your optimal starting sensitivity based on your device specs.</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="deviceRam">Device RAM</label>
                <select id="deviceRam">
                    <option value="low">2GB - 3GB RAM (Low-End)</option>
                    <option value="mid" selected>4GB - 6GB RAM (Mid-Range)</option>
                    <option value="high">8GB+ RAM / Flagship</option>
                </select>
            </div>

            <div class="form-group">
                <label for="playstyle">Preferred Playstyle</label>
                <select id="playstyle">
                    <option value="rusher">Aggressive Rusher (Fast Drag)</option>
                    <option value="onetap" selected>One-Tap / Precision</option>
                    <option value="balanced">Balanced All-Rounder</option>
                </select>
            </div>

            <button onclick="generateSensi()">Generate Sensitivity</button>
        </div>

        <div id="results" class="results-card hidden">
            <h2>Recommended Settings</h2>
            <div class="grid">
                <div class="metric"><span>General:</span> <strong id="valGeneral">--</strong></div>
                <div class="metric"><span>Red Dot:</span> <strong id="valRedDot">--</strong></div>
                <div class="metric"><span>2x Scope:</span> <strong id="val2x">--</strong></div>
                <div class="metric"><span>4x Scope:</span> <strong id="val4x">--</strong></div>
                <div class="metric"><span>Sniper Scope:</span> <strong id="valSniper">--</strong></div>
                <div class="metric"><span>Fire Button Size:</span> <strong id="valFireBtn">--</strong></div>
            </div>
            <p class="tip">💡 <em>Tip: Test these out in the Training Grounds and tweak by ±5 if your crosshair overshoots!</em></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
