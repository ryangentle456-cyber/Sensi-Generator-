<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Multi-Tab Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .dashboard {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 450px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .tab-nav {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border-bottom: 2px solid #ff7e5f;
        }

        .tab-content-container {
            padding: 30px;
            position: relative;
            min-height: 180px;
        }

        .tab-pane {
            display: none;
            opacity: 0;
            transform: translateY(15px);
        }

        .tab-pane.active {
            display: block;
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Smooth Slide and Fade Keyframes */
        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.85rem;
            color: #ddd;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Navigation Buttons -->
        <div class="tab-nav">
            <button class="tab-btn active" data-target="general">General</button>
            <button class="tab-btn" data-target="services">Hub Services</button>
            <button class="tab-btn" data-target="settings">Preferences</button>
        </div>

        <!-- Content Panels -->
        <div class="tab-content-container">
            <!-- Tab 1: General -->
            <div class="tab-pane active" id="general">
                <h2>General Panel</h2>
                <p>Welcome to your main dashboard view with smooth transitions.</p>
                <div class="form-group">
                    <label>Profile Name:</label>
                    <input type="text" placeholder="Enter profile name...">
                </div>
            </div>

            <!-- Tab 2: Hub Services -->
            <div class="tab-pane" id="services">
                <h2>Hub Services</h2>
                <p>Manage external integrations and active service configurations.</p>
                <div class="form-group">
                    <label>Service Endpoint:</label>
                    <input type="text" placeholder="https://api.hubservice.com">
                </div>
            </div>

            <!-- Tab 3: Preferences -->
            <div class="tab-pane" id="settings">
                <h2>Preferences</h2>
                <p>Customize your workspace appearance and animation parameters.</p>
                <div class="form-group">
                    <label>Custom Tag:</label>
                    <input type="text" placeholder="Enter tag...">
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanes = document.querySelectorAll('.tab-pane');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (button.classList.contains('active')) return;

                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabPanes.forEach(pane => pane.classList.remove('active'));

                button.classList.add('active');

                const targetId = button.getAttribute('data-target');
                const targetPane = document.getElementById(targetId);
                targetPane.classList.add('active');
            });
        });
    </script>

</body>
</html>
