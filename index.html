<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRO SENSI X — Auto Device Sensitivity Generator</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.72);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #ff0055;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 2rem 1rem;
    }

    /* Fancy Animated Cyber Background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 242, 254, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
      z-index: -2;
      animation: panGrid 20s linear infinite;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.18), rgba(255, 0, 85, 0.08), transparent 70%);
      filter: blur(60px);
      z-index: -1;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes panGrid {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    }
